steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lettheframework', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lettheframework']

  # Deploy container image to Cloud Run (connects to Supabase PostgreSQL)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lettheframework'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lettheframework'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      # Set Supabase env vars via secrets:
      # - '--set-secrets'
      # - 'SUPABASE_DB_URL=supabase-db-url:latest,NEXT_PUBLIC_SUPABASE_URL=supabase-url:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=supabase-anon-key:latest,SESSION_SECRET=session-secret:latest'

images:
  - 'gcr.io/$PROJECT_ID/lettheframework'
