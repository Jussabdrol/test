steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lettheframework', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lettheframework']

  # Deploy container image to Cloud Run with Cloud SQL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lettheframework'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lettheframework'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      # Cloud SQL connection (uncomment and configure for PostgreSQL)
      # - '--add-cloudsql-instances'
      # - '${PROJECT_ID}:us-central1:lettheframework-db'
      # - '--set-env-vars'
      # - 'DB_TYPE=postgresql,CLOUD_SQL_CONNECTION_NAME=${PROJECT_ID}:us-central1:lettheframework-db,DB_USER=appuser,DB_NAME=lettheframework'
      # - '--set-secrets'
      # - 'DB_PASSWORD=db-password:latest'

# Substitution variables (can be overridden)
substitutions:
  _DB_INSTANCE_NAME: 'lettheframework-db'
  _DB_NAME: 'lettheframework'
  _DB_USER: 'appuser'

images:
  - 'gcr.io/$PROJECT_ID/lettheframework'
